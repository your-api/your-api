# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name demo.yourapi.cn; 
    return 301 https://demo.yourapi.cn;
}

# HTTPS 服务 - demo.yourapi.cn
server {
    listen 443 ssl;
    server_name demo.yourapi.cn; 
    
    # SSL 配置
    ssl_certificate /www/server/nginx/conf/_.yourapi.cn.pem;
    ssl_certificate_key /www/server/nginx/conf/_.yourapi.cn.key;
    
    # 代理头信息
    proxy_set_header Host $host;
    # 真实客户端IP
    proxy_set_header X-Real-IP $remote_addr;
    # 直接使用客户端IP
    proxy_set_header X-Forwarded-For $remote_addr; 
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_read_timeout 3600s;             
    proxy_send_timeout 3600s;            
    send_timeout 3600s;
    
    location / {
        proxy_read_timeout 3600s;             
        proxy_send_timeout 3600s;            
        send_timeout 3600s;
        proxy_set_header Host $host;
        # 真实客户端IP
        proxy_set_header X-Real-IP $remote_addr;
        # 直接使用客户端IP
        proxy_set_header X-Forwarded-For $remote_addr; 
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        
        allow all;
        proxy_pass http://localhost:3001;
        
        # SSE 设置（移除了CORS设置，让Go应用处理）
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
    }
} 