# 文件服务器配置
server {
    listen 443 ssl;
    server_name file.yourapi.cn; 
    
    # SSL 配置
    ssl_certificate /www/server/nginx/conf/_.yourapi.cn.pem;
    ssl_certificate_key /www/server/nginx/conf/_.yourapi.cn.key;
    
    # 设置代理头信息，传递真实 IP
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; 
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    
    # 超时设置
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;
    
    # Gzip 配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    location / {
        proxy_set_header Host filesystem.site;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; 
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        
        allow all;
        proxy_pass https://filesystem.site;
        
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        
        proxy_ssl_server_name on;
        proxy_ssl_name filesystem.site;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name api.yourapi.cn; 
    return 301 https://api.yourapi.cn;
}

# HTTP API服务器 (api8.yourapi.cn)
server {
    listen 80;
    server_name api8.yourapi.cn; 
    
    # 设置代理头信息，传递真实 IP
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr; 
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    
    # Gzip 配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    proxy_read_timeout 3600s;             
    proxy_send_timeout 3600s;            
    send_timeout 3600s;
    
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        
        allow all;
        proxy_pass http://localhost:3001;
        
        proxy_read_timeout 3600s;             
        proxy_send_timeout 3600s;            
        send_timeout 3600s;
        
        # SSE优化设置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # 移除CORS设置，让Go应用统一处理
        # add_header Access-Control-Allow-Origin *;
        # add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        # add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        # 移除OPTIONS处理，让Go应用统一处理
        # if ($request_method = OPTIONS) {
        #     return 204;
        # }
    }
}

