user  www www;
worker_processes auto;
error_log  /www/wwwlogs/nginx_error.log  crit;
pid        /www/server/nginx/logs/nginx.pid;
worker_rlimit_nofile 51200;

stream {
    log_format tcp_format '$time_local|$remote_addr|$protocol|$status|$bytes_sent|$bytes_received|$session_time|$upstream_addr|$upstream_bytes_sent|$upstream_bytes_received|$upstream_connect_time';
  
    access_log /www/wwwlogs/tcp-access.log tcp_format;
    error_log /www/wwwlogs/tcp-error.log;
    include /www/server/panel/vhost/nginx/tcp/*.conf;
}

events
    {
        use epoll;
        worker_connections 51200;
        multi_accept on;
    }

http
    {
        include       mime.types;
		#include luawaf.conf;

		include proxy.conf;
        lua_package_path "/www/server/nginx/lib/lua/?.lua;;";

        default_type  application/octet-stream;

        server_names_hash_bucket_size 512;
        client_header_buffer_size 32k;
        large_client_header_buffers 4 32k;
        client_max_body_size 50m;

        sendfile   on;
        tcp_nopush on;

        keepalive_timeout 60;

        tcp_nodelay on;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 64k;
        fastcgi_buffers 4 64k;
        fastcgi_busy_buffers_size 128k;
        fastcgi_temp_file_write_size 256k;
		fastcgi_intercept_errors on;

        gzip on;
        gzip_min_length  1k;
        gzip_buffers     4 16k;
        gzip_http_version 1.1;
        gzip_comp_level 2;
        gzip_types     text/plain application/javascript application/x-javascript text/javascript text/css application/xml application/json image/jpeg image/gif image/png font/ttf font/otf image/svg+xml application/xml+rss text/x-js;
        gzip_vary on;
        gzip_proxied   expired no-cache no-store private auth;
        gzip_disable   "MSIE [1-6]\.";

        limit_conn_zone $binary_remote_addr zone=perip:10m;
		limit_conn_zone $server_name zone=perserver:10m;

        server_tokens off;
        access_log off;

  upstream chat_backend {
      server localhost:3001;
      # server 193.122.105.199:21058;
  }

  server {
    listen 80;
    server_name yourapi.cn; 
    return 301 https://yourapi.cn;
  }
  
  # HTTPS 服务 - yourapi.cn 和 api.yourapi.cn
  server {
    listen 443 ssl;
    server_name yourapi.cn api.yourapi.cn; 
    
    # SSL 配置
    ssl_certificate /www/server/nginx/conf/_.yourapi.cn.pem;
    ssl_certificate_key /www/server/nginx/conf/_.yourapi.cn.key;
    
    # 代理头信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_read_timeout 3600s;             
    proxy_send_timeout 3600s;            
    send_timeout 3600s;
    
    # 特定路径负载均衡 - /v1/chat/completions
    location /v1/chat/completions {
        proxy_read_timeout 3600s;             
        proxy_send_timeout 3600s;            
        send_timeout 3600s;
        
        # 代理头信息
        proxy_set_header Host $host;
        # 真实客户端IP
        proxy_set_header X-Real-IP $remote_addr;             
        # 直接使用客户端IP
        proxy_set_header X-Forwarded-For $remote_addr;             
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        
        allow all;
        # proxy_pass http://localhost:3001;
        proxy_pass http://chat_backend;
        
        # SSE和流式响应设置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # 移除OPTIONS处理，让Go应用统一处理CORS
        # if ($request_method = OPTIONS) {
        #     return 204;
        # }
    }
    
    # 默认路由
    location / {
        proxy_read_timeout 3600s;             
        proxy_send_timeout 3600s;            
        send_timeout 3600s;
        
        proxy_set_header Host $host;
        # 真实客户端IP
        proxy_set_header X-Real-IP $remote_addr;
        # 直接使用客户端IP
        proxy_set_header X-Forwarded-For $remote_addr; 
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
                
        allow all;
        proxy_pass http://localhost:3001;
        #proxy_pass http://193.122.105.199:21058;
        
        # SSE和流式响应设置
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # 移除OPTIONS处理，让Go应用统一处理CORS
        # if ($request_method = OPTIONS) {
        #     return 204;
        # }
    }
  }

include /www/server/panel/vhost/nginx/*.conf;
} 